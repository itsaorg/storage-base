# =============================================================================
# 🐛 Bug report — GitHub issue form for defects
# =============================================================================
# 📌 Purpose: interactive form on the New issue page. On submit, GitHub turns
#    each field label into a Markdown heading in the issue body.
# ⚠️ Keep label text identical to .github/ISSUE_TEMPLATE/bug_report.md headings.
# ▶️ Example: a reporter fills Summary and Steps to reproduce, then submits.
# =============================================================================

# 🏷️ name: chooser card title
name: Bug report
# 📄 description: one-line card subtitle
description: Report a defect in this repository
# 🏷️ title: default issue title; replace <slug> before submitting
title: "🐞 BUG: <slug>"
# 🏷️ labels: labels applied when the issue is opened
labels: ["🐞 Bug Report"]
# 📋 body: ordered form elements
body:
  # 📝 markdown: static text, not a submitted field
  - type: markdown
    # ⚙️ attributes: element settings
    attributes:
      # 📃 value: intro shown above the fields
      value: |
        Thanks for reporting a defect in this repository.
        If this is a vulnerability, stop and follow SECURITY.md. Do not add a security label.
        Otherwise this form applies the 🐞 Bug Report label. Fill every required section.
  # 📝 textarea: multi-line input
  - type: textarea
    # 🆔 id: stable field id (not shown as the heading)
    id: summary
    # ⚙️ attributes: label, help, and placeholder
    attributes:
      # 🏷️ label: becomes the Markdown heading in the issue body
      label: "🧾 Summary"
      # 💬 description: help text under the label
      description: What is broken, in one or two sentences.
      # ✏️ placeholder: grey hint inside the empty box
      placeholder: Page address parsing rejects a valid offset when …
    # ✅ validations: submit rules
    validations:
      # 🔒 required: true blocks submit when empty
      required: true
  # 📝 textarea: expected outcome
  - type: textarea
    # 🆔 id: expected
    id: expected
    attributes:
      # 🏷️ label: Expected behavior
      label: "✅ Expected behavior"
      # 💬 description: contract or docs behavior
      description: What the contract or docs say should happen.
      # ✏️ placeholder: example of a correct result
      placeholder: The call should return … / throw StorageError with code …
    validations:
      # 🔒 required: reporter must fill this in
      required: true
  # 📝 textarea: what actually happened
  - type: textarea
    # 🆔 id: actual
    id: actual
    attributes:
      # 🏷️ label: Actual behavior
      label: "❌ Actual behavior"
      # 💬 description: observed result, including errors
      description: What happened instead, including the error text if any.
      # ✏️ placeholder: quoted because the text contains a colon
      placeholder: "Threw TypeError: …"
    validations:
      # 🔒 required: reporter must fill this in
      required: true
  # 📝 textarea: reproduction
  - type: textarea
    # 🆔 id: steps
    id: steps
    attributes:
      # 🏷️ label: Steps to reproduce
      label: "🔁 Steps to reproduce"
      # 💬 description: ask for the smallest sequence
      description: Smallest sequence that shows the defect. Prefer a snippet over a narrative.
      # ✏️ placeholder: numbered steps (literal block)
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      # 🔒 required: reporter must fill this in
      required: true
  # 📝 textarea: runtime context
  - type: textarea
    # 🆔 id: environment
    id: environment
    attributes:
      # 🏷️ label: Environment
      label: "💻 Environment"
      # 💬 description: Node from .nvmrc, OS, package version
      description: Node from `.nvmrc`, OS, and the package version or commit you ran.
      # ✏️ placeholder: bullet list the reporter can edit
      placeholder: |
        - Node: (version in .nvmrc)
        - OS: …
        - Package: (name and version from package.json, commit …)
    validations:
      # 🔒 required: reporter must fill this in
      required: true
  # 📝 textarea: optional extra notes
  - type: textarea
    # 🆔 id: context
    id: context
    attributes:
      # 🏷️ label: Additional context
      label: "📎 Additional context"
      # 💬 description: logs and links
      description: Logs, related issues, or anything else that helps. Optional.
      # ✏️ placeholder: empty hint
      placeholder: …
    validations:
      # 🔓 required: false allows an empty box
      required: false
